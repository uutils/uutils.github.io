# The URL the site will be built for
base_url = "https://uutils.org"

title = "uutils"

description = "uutils — cross-platform Rust reimplementations of essential Unix command-line utilities"

default_language = "en"

generate_feeds = true

[link_checker]
# These sites build their anchors client-side, so `zola check` can't see them
# in the served HTML and reports false positives:
#   - GitHub `#L12` line anchors on blob pages
#   - developers.google.com FAQ section anchors
skip_anchor_prefixes = [
  "https://github.com/",
  "https://developers.google.com/",
]

[markdown]
[markdown.highlighting]
style = "class"
light_theme = "one-light"
dark_theme = "one-dark-pro"
